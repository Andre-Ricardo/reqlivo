[package]
name = "reqlivo-desktop"
version = "0.2.0"
edition = "2024"
description = "Aplicativo desktop Reqlivo"
license = "MIT"
default-run = "reqlivo-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqlivo = { path = ".." }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync"] }
