name: Desktop e releases

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils xvfb imagemagick
      - name: Instalar Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - run: npm ci
      - name: Conferir versão e tag
        shell: bash
        run: python scripts/check-version.py
      - name: Formatação e testes
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
      - name: Gerar instaladores
        run: npm run desktop:build -- --bundles ${{ matrix.bundles }} -- --locked
      - name: Abrir aplicativo Linux e capturar janela
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1600x1000x24' bash <<'SMOKE'
          set -euo pipefail
          appimage=$(find target/release/bundle/appimage -name '*.AppImage' -print -quit)
          "$appimage" --appimage-extract-and-run --collection examples/demo > desktop-smoke.log 2>&1 &
          desktop_pid=$!
          trap 'kill "$desktop_pid" 2>/dev/null || true' EXIT
          sleep 15
          kill -0 "$desktop_pid"
          import -window root desktop-linux.png
          test "$(identify -format '%k' desktop-linux.png)" -gt 20
          SMOKE
      - name: Abrir aplicativo Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process target/release/reqlivo-desktop.exe -ArgumentList '--collection', 'examples/demo' -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw 'O aplicativo não abriu uma janela.' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: desktop-smoke-linux
          path: |
            desktop-linux.png
            desktop-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: reqlivo-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe

  release:
    name: Publicar release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@v4
        with:
          pattern: reqlivo-*
          path: installers
          merge-multiple: true
      - name: Publicar instaladores e checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mkdir release-assets
          find installers -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' \) -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum *.deb *.AppImage *.exe > SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "Reqlivo $RELEASE_TAG"
          fi
